<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人日常工作台</title>
<style>
:root{
  --blue:#2f7cf6; --blue-deep:#1f63d8; --blue-light:#eaf2ff;
  --bg:#eef4ff; --card:#fff; --text:#1e2b45; --muted:#8b98b1; --line:#e9f0fc;
  --green:#2fbe72; --orange:#ff9f43; --purple:#8b7cf6; --yellow:#ffc542; --red:#ff6b6b;
  --shadow:0 6px 22px rgba(38,102,210,.07);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:flex;min-height:100vh}

/* ---------- 侧边栏 ---------- */
.sidebar{width:212px;flex:none;background:linear-gradient(170deg,#2a72ef 0%,#4b9bfb 58%,#8fc0ff 100%);color:#fff;padding:22px 14px 30px;position:relative;overflow:hidden}
.sidebar::after{content:"";position:absolute;left:-60px;bottom:-70px;width:260px;height:220px;background:rgba(255,255,255,.09);border-radius:50% 50% 0 0;transform:rotate(-18deg);pointer-events:none}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 22px;position:relative;z-index:1}
.brand .ava{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#ffd9b8,#ffb37a);display:flex;align-items:center;justify-content:center;font-weight:700;color:#7a4a22;font-size:16px;border:2px solid rgba(255,255,255,.85);box-shadow:0 3px 10px rgba(0,0,0,.12)}
.brand .txt b{display:block;font-size:14px;letter-spacing:.5px}
.brand .txt span{display:block;font-size:12px;opacity:.82;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:5px;position:relative;z-index:1}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 13px;border-radius:10px;color:rgba(255,255,255,.9);text-decoration:none;font-size:13.5px;cursor:pointer;transition:.18s}
.nav a:hover{background:rgba(255,255,255,.14)}
.nav a.on{background:#fff;color:var(--blue-deep);font-weight:600;box-shadow:0 4px 14px rgba(20,70,170,.16)}
.nav a .i{width:17px;height:17px}

/* ---------- 主区 ---------- */
.main{flex:1;min-width:0;padding:0 26px 34px}
.topbar{height:64px;display:flex;align-items:center;gap:18px}
.search{flex:1;max-width:430px;height:38px;background:#fff;border-radius:19px;display:flex;align-items:center;gap:9px;padding:0 16px;box-shadow:var(--shadow);color:var(--muted)}
.search input{border:0;outline:0;flex:1;font-size:13px;color:var(--text);background:transparent}
.search input::placeholder{color:#a8b4c8}
.bell{position:relative;width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:#5c6b86;cursor:pointer}
.bell .dot{position:absolute;top:-1px;right:-2px;min-width:17px;height:17px;background:var(--red);color:#fff;font-size:10px;border-radius:9px;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg);font-weight:600}
.clock{text-align:right;line-height:1.35;margin-left:auto}
.clock .d{font-size:12.5px;color:#58687f}
.clock .t{font-size:15px;font-weight:600;color:#33425c;font-variant-numeric:tabular-nums}
.me{display:flex;align-items:center;gap:8px;padding-left:16px;border-left:1px solid #dbe6f8;cursor:pointer}
.me .ava{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#ffd3e0,#ffb0a0);display:flex;align-items:center;justify-content:center;color:#8a3a4a;font-weight:700;font-size:13px}
.me span{font-size:13px;color:#42516a}

.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:8px 0 18px;position:relative}
.page-head h1{font-size:27px;font-weight:800;letter-spacing:.5px}
.page-head h1 em{font-style:normal;color:var(--blue);position:relative}
.page-head p{font-size:12.5px;color:var(--muted);margin-top:7px}
.filters{display:flex;align-items:center;gap:6px;background:#fff;padding:5px;border-radius:11px;box-shadow:var(--shadow)}
.filters button{border:0;background:transparent;padding:7px 13px;border-radius:8px;font-size:12.5px;color:#66748c;cursor:pointer;white-space:nowrap;transition:.15s}
.filters button:hover{background:var(--blue-light)}
.filters button.on{background:var(--blue);color:#fff;font-weight:600;box-shadow:0 3px 8px rgba(47,124,246,.3)}
.filters .sep{width:1px;height:18px;background:var(--line);margin:0 3px}
.filters .range{display:flex;align-items:center;gap:6px;color:#5b6a83;font-size:12px;padding:7px 10px;cursor:pointer}
.head-deco{position:absolute;right:8px;top:-14px;font-size:13px;color:var(--muted);opacity:.75;display:flex;gap:6px;align-items:center}
.head-deco .blob{width:120px;height:52px;border-radius:14px;background:linear-gradient(120deg,#dceaff,#eaf3ff);position:relative;overflow:hidden}
.head-deco .blob::before{content:"";position:absolute;left:18px;bottom:8px;width:44px;height:30px;background:#a9c9fa;border-radius:4px;transform:skewY(-8deg)}
.head-deco .blob::after{content:"";position:absolute;right:16px;top:10px;width:26px;height:26px;background:#8fd6b0;border-radius:50%}

/* ---------- 卡片通用 ---------- */
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:18px 20px}
.card h3{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.card h3::before{content:"";width:3px;height:14px;background:var(--blue);border-radius:2px}
.card .more{margin-left:auto;font-size:12px;color:var(--muted);font-weight:400;cursor:pointer}
.card .more:hover{color:var(--blue)}

/* 统计卡 */
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:16px}
.stat{background:#fff;border-radius:15px;box-shadow:var(--shadow);padding:16px 17px;display:flex;gap:12px;align-items:flex-start;position:relative;overflow:hidden}
.stat .ic{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none}
.stat .ic .i{width:21px;height:21px}
.stat .n{font-size:26px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
.stat .lb{font-size:12.5px;color:#6b7890;margin-top:3px}
.stat .dt{font-size:11px;color:var(--muted);margin-top:9px}
.stat .dt b{font-weight:600}
.up{color:var(--red)}.down{color:var(--green)}
.stat .bar{position:absolute;right:14px;bottom:14px;width:56px;height:5px;background:#eef3fb;border-radius:3px;overflow:hidden}
.stat .bar i{display:block;height:100%;background:var(--blue);border-radius:3px}
.bg-blue{background:#e8f1ff;color:#2f7cf6}.bg-green{background:#e6f8ee;color:#2fbe72}
.bg-orange{background:#fff2e5;color:#ff9f43}.bg-purple{background:#f0edff;color:#8b7cf6}
.bg-yellow{background:#fff7e0;color:#f0aa16}

/* 两列 */
.row2{display:grid;grid-template-columns:1.32fr 1fr;gap:16px;margin-bottom:16px}
.row3{display:grid;grid-template-columns:1.32fr 1fr;gap:16px;margin-bottom:16px}
.row4{display:grid;grid-template-columns:1.15fr .82fr .95fr 1fr;gap:16px}
.chart-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.chart-head select{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 9px;font-size:12px;color:#66748c;outline:0;cursor:pointer}
.legend{display:flex;gap:14px;justify-content:center;font-size:11.5px;color:#7b889e;margin-top:2px}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px}
#trendSvg{width:100%;height:196px;display:block}
.donut-wrap{display:flex;align-items:center;gap:14px;justify-content:center}
#donutSvg{width:172px;height:172px;flex:none}
.donut-legend{display:flex;flex-direction:column;gap:9px;font-size:12px;min-width:112px}
.donut-legend div{display:flex;align-items:center;gap:7px;color:#5d6b83}
.donut-legend i{width:9px;height:9px;border-radius:50%;flex:none}
.donut-legend b{margin-left:auto;color:#33425c;font-variant-numeric:tabular-nums}

/* 待办 */
.todo-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.todo-head h3::before{display:none}
.badge{background:var(--blue-light);color:var(--blue);font-size:11px;padding:2px 8px;border-radius:9px;font-weight:600}
.add-btn{margin-left:auto;border:0;background:var(--blue);color:#fff;font-size:12px;padding:7px 13px;border-radius:9px;cursor:pointer;display:flex;align-items:center;gap:5px;font-weight:600;box-shadow:0 3px 9px rgba(47,124,246,.28)}
.add-btn:hover{background:var(--blue-deep)}
.add-btn .i{width:14px;height:14px}
.todo{display:flex;flex-direction:column}
.todo .item{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px dashed #eef2f9;cursor:pointer;transition:.15s}
.todo .item:last-child{border-bottom:0}
.todo .item:hover{background:#fafcff}
.todo .cb{width:17px;height:17px;border:2px solid #cfd9ea;border-radius:5px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;transition:.15s}
.todo .item.done .cb{background:var(--green);border-color:var(--green)}
.todo .cb .i{width:12px;height:12px;stroke-width:3;opacity:0}
.todo .item.done .cb .i{opacity:1}
.todo .tx{flex:1;font-size:13px;color:#3a4760;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.todo .item.done .tx{text-decoration:line-through;color:#aab5c7}
.tag{font-size:11px;padding:2px 9px;border-radius:6px;flex:none}
.todo .tm{font-size:12px;color:#98a4b8;width:42px;text-align:right;flex:none;font-variant-numeric:tabular-nums}
.tag-work{background:#e8f6ee;color:#2f9e62}.tag-comm{background:#e9f2ff;color:#3b7bea}
.tag-plan{background:#fff2e4;color:#ef9428}.tag-meet{background:#ffecec;color:#e9635f}
.tag-doc{background:#f0edff;color:#8874e8}.tag-proj{background:#e7f4ff;color:#2f8fd6}
.tag-rev{background:#e6f7f6;color:#1e9c98}

/* 日程 */
.sched{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.sched .s{display:flex;align-items:center;gap:10px;padding:8px 2px;position:relative}
.sched .s::before{content:"";position:absolute;left:5px;top:0;bottom:0;width:1px;background:#e6edf9}
.sched .s:first-child::before{top:50%}.sched .s:last-child::before{bottom:50%}
.sched .dot{width:11px;height:11px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 2px currentColor;flex:none;z-index:1;margin-left:0}
.sched .hh{font-size:12px;color:#5f6d84;width:78px;flex:none;font-variant-numeric:tabular-nums}
.sched .ev{font-size:13px;color:#3a4760;display:flex;align-items:center;gap:7px}
.sched .ev .i{width:15px;height:15px;color:#8b98b1}

/* 目标 */
.goals{display:flex;flex-direction:column;gap:13px;margin-top:14px}
.goal .top{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#4a5870;margin-bottom:6px}
.goal .top .i{width:15px;height:15px;color:var(--orange)}
.goal .top b{margin-left:auto;font-size:12px;color:#6b7890;font-variant-numeric:tabular-nums}
.pbar{height:7px;background:#eef3fb;border-radius:5px;overflow:hidden}
.pbar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#31c47a,#5ad39a);transition:width .5s}
.pbar.mid i{background:linear-gradient(90deg,#3b8bf0,#63a8f8)}
.pbar.low i{background:linear-gradient(90deg,#ffb14a,#ffcb7d)}

/* 备忘 */
.memo{background:linear-gradient(160deg,#fff9e8,#fff4d6);border-radius:12px;padding:14px 15px 16px;margin-top:12px;position:relative;min-height:170px;box-shadow:inset 0 0 0 1px #f6e7bb}
.memo::before{content:"";position:absolute;top:-7px;left:50%;transform:translateX(-50%) rotate(-3deg);width:56px;height:16px;background:rgba(255,214,120,.65);border-radius:2px}
.memo .m{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:12.5px;color:#6a5a35;cursor:pointer}
.memo .cb{width:15px;height:15px;border:2px solid #d9bd7b;border-radius:4px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff}
.memo .m.done .cb{background:#e8a94a;border-color:#e8a94a}
.memo .cb .i{width:11px;height:11px;stroke-width:3;opacity:0}
.memo .m.done .cb .i{opacity:1}
.memo .m.done span{text-decoration:line-through;opacity:.6}

/* 工具 */
.tools{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.tool{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 4px;border-radius:11px;cursor:pointer;transition:.15s;font-size:12px;color:#5a6880}
.tool:hover{transform:translateY(-2px);box-shadow:0 5px 14px rgba(40,100,200,.1)}
.tool .ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center}
.tool .ic .i{width:20px;height:20px}

/* 复盘 */
.review{display:flex;flex-direction:column;gap:11px;margin-top:14px}
.review .r{display:flex;align-items:center;gap:9px;font-size:12.5px;color:#4a5870}
.review .r .i{width:16px;height:16px;color:var(--green)}
.review button{margin-top:6px;border:0;background:linear-gradient(100deg,#3a86f7,#5aa2ff);color:#fff;font-size:13px;font-weight:600;padding:11px;border-radius:11px;cursor:pointer;box-shadow:0 5px 14px rgba(47,124,246,.3)}
.review button:hover{filter:brightness(1.05)}
.review button.ok{background:linear-gradient(100deg,#31c47a,#5ad39a);box-shadow:0 5px 14px rgba(47,190,114,.28)}

/* 弹窗 & toast */
.mask{position:fixed;inset:0;background:rgba(24,40,70,.35);display:none;align-items:center;justify-content:center;z-index:50;backdrop-filter:blur(2px)}
.mask.show{display:flex}
.modal{background:#fff;border-radius:16px;width:390px;max-width:92vw;padding:22px;box-shadow:0 18px 50px rgba(20,50,110,.25)}
.modal h3{font-size:16px;margin-bottom:16px}
.modal label{display:block;font-size:12px;color:#6b7890;margin:11px 0 5px}
.modal input,.modal select{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:13px;outline:0;color:var(--text)}
.modal input:focus,.modal select:focus{border-color:var(--blue)}
.modal .acts{display:flex;gap:10px;margin-top:20px}
.modal .acts button{flex:1;padding:10px;border-radius:9px;font-size:13px;cursor:pointer;border:0;font-weight:600}
.modal .cancel{background:#f0f4fb;color:#66748c}
.modal .confirm{background:var(--blue);color:#fff}
.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);background:#26324a;color:#fff;font-size:13px;padding:11px 20px;border-radius:10px;opacity:0;transition:.25s;z-index:80;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:1180px){
  .stats{grid-template-columns:repeat(3,1fr)}
  .row4{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:900px){
  .sidebar{width:64px;padding:18px 8px}
  .brand .txt,.nav a span{display:none}
  .brand{justify-content:center;padding:0 0 18px}
  .nav a{justify-content:center;padding:11px}
  .row2,.row3{grid-template-columns:1fr}
  .page-head{flex-direction:column;align-items:flex-start}
  .head-deco{display:none}
  .filters{flex-wrap:wrap}
}
@media(max-width:600px){
  /* 侧边栏 → 底部导航（移动端标准形态） */
  .app{display:block}
  .sidebar{position:fixed;left:0;right:0;bottom:0;top:auto;width:100%;padding:7px 10px calc(9px + env(safe-area-inset-bottom));z-index:40;overflow:visible}
  .sidebar::after{display:none}
  .brand{display:none}
  .nav{flex-direction:row;gap:2px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav a{flex:none;flex-direction:column;gap:3px;padding:7px 11px;font-size:10.5px;border-radius:9px}
  .nav a span{display:inline;font-size:10.5px}
  .nav a .i{width:19px;height:19px}
  .main{padding:0 12px calc(88px + env(safe-area-inset-bottom))}
  /* 顶栏精简 */
  .topbar{height:56px;gap:12px}
  .me{display:none}
  .search{max-width:none}
  /* 卡片与图表 */
  .card{padding:15px 14px;border-radius:14px}
  .page-head h1{font-size:22px}
  .filters{width:100%;overflow-x:auto;scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .filters button{padding:7px 11px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .stat{padding:13px 14px}
  .stat .n{font-size:22px}
  .row4{grid-template-columns:1fr}
  .donut-wrap{flex-wrap:wrap}
  #donutSvg{width:148px;height:148px}
  .donut-legend{min-width:0;flex:1}
  .clock .d{display:none}
}
</style>
</head>

<symbol id="i-table" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 9v11M15 9v11"/></symbol>

<script>
/* ============ 数据 ============ */
var KEY = 'workbench-state-v1';
var DEFAULT = {
  tasks:[
    {id:1,text:'整理项目周报并提交',tag:'工作',time:'10:00',done:true},
    {id:2,text:'回复重要邮件',tag:'沟通',time:'11:00',done:true},
    {id:3,text:'完善下周工作计划',tag:'计划',time:'14:00',done:false},
    {id:4,text:'准备会议材料',tag:'会议',time:'15:30',done:false},
    {id:5,text:'整理文档并归档',tag:'资料',time:'16:30',done:false},
    {id:6,text:'跟进项目进度',tag:'项目',time:'17:30',done:false},
    {id:7,text:'复盘今日工作并记录',tag:'复盘',time:'20:00',done:false}
  ],
  memos:[
    {id:1,text:'整理会议纪要',done:true},
    {id:2,text:'更新项目台账',done:false},
    {id:3,text:'准备汇报PPT',done:false},
    {id:4,text:'跟进重要事项',done:false}
  ],
  goals:[
    {id:1,text:'完成项目阶段性文档',pct:100},
    {id:2,text:'优化工作流程',pct:80},
    {id:3,text:'学习1个新工具',pct:60},
    {id:4,text:'输出1周工作复盘',pct:40},
    {id:5,text:'整理资料库',pct:80}
  ],
  reviewDone:false,
  nextId:8
};
var state = load();
function load(){
  try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&s.tasks){s.nextId=s.nextId||8;return s}}catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT));
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}

var RANGES = {
  today:{doing:6,arrange:7,doneBase:26,todoBase:7,deltas:[-20,33,40,17],hours:40.5,label:'2026-11-24 ~ 2026-11-24',
    add:[8,13,9,14,12,19,16],fin:[5,8,7,11,9,14,13],rate:[62,66,64,74,72,82,88],days:7},
  week:{doing:18,arrange:32,doneBase:118,todoBase:36,deltas:[12,8,25,6],hours:168,label:'2026-11-18 ~ 2026-11-24',
    add:[64,72,58,81,69,88,76],fin:[42,51,46,63,55,71,68],rate:[68,70,66,76,74,80,84],days:7},
  d30:{doing:42,arrange:138,doneBase:498,todoBase:172,deltas:[8,15,31,12],hours:692,label:'2026-10-26 ~ 2026-11-24',
    add:[212,238,196,254,231,268,244],fin:[168,182,159,206,188,224,211],rate:[65,68,70,72,75,78,82],days:7},
  month:{doing:24,arrange:66,doneBase:252,todoBase:84,deltas:[5,11,22,9],hours:386,label:'2026-11-01 ~ 2026-11-24',
    add:[98,112,86,124,104,136,118],fin:[76,88,71,102,91,116,109],rate:[66,69,68,74,73,80,85],days:7}
};
var curRange = 'today';

var SCHED = [
  {t:'09:00 - 10:00',e:'团队晨会（线上）',c:'#ff6b6b',i:'i-users'},
  {t:'10:00 - 11:00',e:'项目进度汇报',c:'#2fbe72',i:'i-chart'},
  {t:'14:00 - 15:30',e:'需求讨论会议',c:'#4a90ff',i:'i-chat'},
  {t:'16:00 - 17:00',e:'文档整理与归档',c:'#2fbe72',i:'i-folder'},
  {t:'19:30 - 20:30',e:'学习提升（AI工具）',c:'#4a90ff',i:'i-ai'}
];
var TOOLS = [
  {n:'在线文档',i:'i-doc',c:'#e8f1ff',k:'#2f7cf6'},
  {n:'云盘存储',i:'i-cloud',c:'#e6f8ee',k:'#2fbe72'},
  {n:'思维导图',i:'i-mind',c:'#e8f1ff',k:'#2f7cf6'},
  {n:'表格管理',i:'i-table',c:'#e6f8ee',k:'#2fbe72'},
  {n:'时间番茄',i:'i-clock',c:'#ffecea',k:'#ff6b6b'},
  {n:'AI助手',i:'i-ai',c:'#f0edff',k:'#8b7cf6'}
];
var DONUT = [
  {n:'项目工作',v:36,c:'#3b86f7'},{n:'资料整理',v:22,c:'#2fbe72'},
  {n:'沟通协作',v:16,c:'#ffc542'},{n:'学习提升',v:14,c:'#ff7a7a'},
  {n:'日常事务',v:12,c:'#a58cf8'}
];
var TAGC = {'工作':'tag-work','沟通':'tag-comm','计划':'tag-plan','会议':'tag-meet','资料':'tag-doc','项目':'tag-proj','复盘':'tag-rev'};

/* ============ 工具函数 ============ */
function el(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var toastTimer;
function toast(msg){var t=el('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('show')},1900)}
function icon(id,cls){return '<svg class="i '+(cls||'')+'"><use href="#'+id+'"/></svg>'}
function pad(n){return n<10?'0'+n:''+n}

/* ============ 时钟 ============ */
var WEEK=['日','一','二','三','四','五','六'];
function tick(){
  var d=new Date();
  el('dateTxt').textContent=d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 星期'+WEEK[d.getDay()];
  el('timeTxt').textContent=pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
}
tick();setInterval(tick,1000);

/* ============ 统计卡 ============ */
function renderStats(){
  var r=RANGES[curRange];
  var undone=state.tasks.filter(function(t){return !t.done}).length;
  var done=state.tasks.filter(function(t){return t.done}).length;
  var vals=[r.todoBase+undone,r.doing,r.doneBase+done,r.arrange,state.goals.length];
  var names=['待办任务','进行中','已完成','今日安排','本周目标'];
  var ics=[['i-task','bg-blue'],['i-trend','bg-blue'],['i-check','bg-green'],['i-cal','bg-purple'],['i-target','bg-orange']];
  var goalAvg=Math.round(state.goals.reduce(function(a,g){return a+g.pct},0)/state.goals.length);
  var html='';
  for(var i=0;i<5;i++){
    var dv=r.deltas[i]||0;
    var dt=i===4
      ? '完成率 <b style="color:#2f7cf6">'+goalAvg+'%</b>'
      : '较昨日 <b class="'+(dv>=0?'up':'down')+'">'+(dv>=0?'+':'')+dv+'%</b> '+(dv>=0?'↑':'↓');
    html+='<div class="stat"><div class="ic '+ics[i][1]+'">'+icon(ics[i][0])+'</div><div><div class="n">'+vals[i]+'</div><div class="lb">'+names[i]+'</div><div class="dt">'+dt+'</div></div>'+(i===4?'<div class="bar"><i style="width:'+goalAvg+'%"></i></div>':'')+'</div>';
  }
  el('stats').innerHTML=html;
}

/* ============ 趋势图（SVG） ============ */
function renderTrend(){
  var r=RANGES[curRange];
  var W=560,H=200,L=32,R=34,T=12,B=28;
  var pw=W-L-R,ph=H-T-B;
  var maxV=Math.max.apply(null,r.add)*1.12;
  var n=r.add.length,gw=pw/n;
  var s='';
  // 网格 + 左轴
  for(var k=0;k<=5;k++){
    var y=T+ph*k/5;
    s+='<line x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'" stroke="#eef2f9" stroke-width="1"/>';
    s+='<text x="'+(L-7)+'" y="'+(y+3)+'" text-anchor="end" font-size="9" fill="#a3aec0">'+Math.round(maxV*(5-k)/5)+'</text>';
    s+='<text x="'+(W-R+6)+'" y="'+(y+3)+'" font-size="9" fill="#a3aec0">'+(100-k*20)+'%</text>';
  }
  var pts=[];
  for(var i=0;i<n;i++){
    var cx=L+gw*i+gw/2;
    var bw=Math.min(11,gw*0.24);
    var h1=r.add[i]/maxV*ph,h2=r.fin[i]/maxV*ph;
    s+='<rect x="'+(cx-bw-2)+'" y="'+(T+ph-h1)+'" width="'+bw+'" height="'+h1+'" rx="2.5" fill="#4a90ff" opacity=".92"/>';
    s+='<rect x="'+(cx+2)+'" y="'+(T+ph-h2)+'" width="'+bw+'" height="'+h2+'" rx="2.5" fill="#2fbe72" opacity=".92"/>';
    var py=T+ph-r.rate[i]/100*ph;
    pts.push([cx,py]);
    var d=new Date();d.setDate(d.getDate()-(n-1-i));
    s+='<text x="'+cx+'" y="'+(H-10)+'" text-anchor="middle" font-size="9.5" fill="#7b889e">'+(d.getMonth()+1)+'/'+d.getDate()+'</text>';
    s+='<text x="'+cx+'" y="'+(H-1)+'" text-anchor="middle" font-size="8.5" fill="#b0bacb">周'+WEEK[d.getDay()]+'</text>';
  }
  var path=pts.map(function(p,i){return (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)}).join(' ');
  s+='<path d="'+path+'" fill="none" stroke="#ff9f43" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  pts.forEach(function(p){s+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3" fill="#fff" stroke="#ff9f43" stroke-width="2"/>'});
  el('trendSvg').innerHTML=s;
}

/* ============ 环形图（SVG） ============ */
function renderDonut(){
  var r=RANGES[curRange],cx=90,cy=90,rad=62,C=2*Math.PI*rad,off=0,s='';
  s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+rad+'" fill="none" stroke="#f0f4fb" stroke-width="20"/>';
  DONUT.forEach(function(d){
    var len=C*d.v/100;
    s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+rad+'" fill="none" stroke="'+d.c+'" stroke-width="20" stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'" transform="rotate(-90 '+cx+' '+cy+')"/>';
    off+=len;
  });
  s+='<text x="'+cx+'" y="'+(cy-4)+'" text-anchor="middle" font-size="23" font-weight="800" fill="#1e2b45">'+r.hours+'h</text>';
  s+='<text x="'+cx+'" y="'+(cy+16)+'" text-anchor="middle" font-size="11" fill="#8b98b1">工作时长</text>';
  el('donutSvg').innerHTML=s;
  el('donutLegend').innerHTML=DONUT.map(function(d){return '<div><i style="background:'+d.c+'"></i>'+d.n+'<b>'+d.v+'%</b></div>'}).join('');
}

/* ============ 待办清单 ============ */
function renderTodo(filter){
  var kw=(filter||'').trim();
  var list=state.tasks.filter(function(t){return !kw||t.text.indexOf(kw)>=0||t.tag.indexOf(kw)>=0});
  el('todoBadge').textContent=state.tasks.filter(function(t){return !t.done}).length;
  if(!list.length){el('todoList').innerHTML='<div style="padding:26px;text-align:center;color:#a3aec0;font-size:13px">没有匹配的任务</div>';return}
  el('todoList').innerHTML=list.map(function(t){
    return '<div class="item '+(t.done?'done':'')+'" data-id="'+t.id+'"><div class="cb">'+icon('i-check')+'</div><div class="tx">'+esc(t.text)+'</div><span class="tag '+(TAGC[t.tag]||'tag-work')+'">'+esc(t.tag)+'</span><span class="tm">'+esc(t.time)+'</span></div>';
  }).join('');
  Array.prototype.forEach.call(el('todoList').querySelectorAll('.item'),function(node){
    node.onclick=function(){
      var id=+node.dataset.id;
      var t=state.tasks.filter(function(x){return x.id===id})[0];
      if(t){t.done=!t.done;save();renderTodo(el('search').value);renderStats();toast(t.done?'已完成，干得漂亮':'已恢复为待办')}
    };
  });
}

/* ============ 日程 ============ */
function renderSched(){
  el('schedList').innerHTML=SCHED.map(function(x){
    return '<div class="s"><span class="dot" style="color:'+x.c+';background:'+x.c+'"></span><span class="hh">'+x.t+'</span><span class="ev">'+icon(x.i)+esc(x.e)+'</span></div>';
  }).join('');
}

/* ============ 目标 / 备忘 / 工具 / 复盘 ============ */
function renderGoals(){
  el('goalBadge').textContent=state.goals.length;
  el('goalList').innerHTML=state.goals.map(function(g){
    var cls=g.pct>=100?'':(g.pct>=60?'mid':'low');
    return '<div class="goal"><div class="top">'+icon('i-target')+'<span>'+esc(g.text)+'</span><b>'+g.pct+'%</b></div><div class="pbar '+cls+'"><i style="width:'+g.pct+'%"></i></div></div>';
  }).join('');
}
function renderMemos(){
  el('memoList').innerHTML=state.memos.map(function(m){
    return '<div class="m '+(m.done?'done':'')+'" data-id="'+m.id+'"><div class="cb">'+icon('i-check')+'</div><span>'+esc(m.text)+'</span></div>';
  }).join('');
  Array.prototype.forEach.call(el('memoList').querySelectorAll('.m'),function(node){
    node.onclick=function(){
      var m=state.memos.filter(function(x){return x.id===+node.dataset.id})[0];
      if(m){m.done=!m.done;save();renderMemos()}
    };
  });
}
function renderTools(){
  el('toolList').innerHTML=TOOLS.map(function(t){
    return '<div class="tool" data-n="'+t.n+'"><div class="ic" style="background:'+t.c+';color:'+t.k+'">'+icon(t.i)+'</div>'+t.n+'</div>';
  }).join('');
  Array.prototype.forEach.call(el('toolList').querySelectorAll('.tool'),function(node){
    node.onclick=function(){toast(node.dataset.n+'：演示版，接入后跳转对应工具')};
  });
}
var REVIEWS=['目标完成情况','重点工作成果','问题与改进','下周工作规划'];
function renderReview(){
  el('reviewList').innerHTML=REVIEWS.map(function(x){return '<div class="r">'+icon('i-check')+x+'</div>'}).join('');
  var b=el('reviewBtn');
  b.textContent=state.reviewDone?'已完成复盘':'开始复盘';
  b.className=state.reviewDone?'ok':'';
}

/* ============ 事件绑定 ============ */
el('search').addEventListener('input',function(){renderTodo(this.value)});

Array.prototype.forEach.call(el('filters').querySelectorAll('button'),function(btn){
  btn.onclick=function(){
    Array.prototype.forEach.call(el('filters').querySelectorAll('button'),function(b){b.classList.remove('on')});
    btn.classList.add('on');curRange=btn.dataset.r;
    el('rangeTxt').innerHTML=icon('i-cal')+' '+RANGES[curRange].label;
    renderStats();renderTrend();renderDonut();
    toast('已切换：'+btn.textContent);
  };
});

el('trendSel').onchange=function(){toast('图表维度：'+this.options[this.selectedIndex].text)};
el('timeSel').onchange=function(){toast('时间分配：'+this.value)};
el('calMore').onclick=function(){toast('日历视图：演示版')};
el('goalMore').onclick=function(){toast('共 '+state.goals.length+' 个本周目标')};
el('bell').onclick=function(){toast('3 条未读提醒')};

Array.prototype.forEach.call(el('nav').querySelectorAll('a'),function(a){
  a.onclick=function(){
    Array.prototype.forEach.call(el('nav').querySelectorAll('a'),function(x){x.classList.remove('on')});
    a.classList.add('on');
    toast(a.dataset.page==='日常工作台'?'已回到工作台':'「'+a.dataset.page+'」演示版，可后续扩展为独立页面');
  };
});

el('reviewBtn').onclick=function(){
  state.reviewDone=!state.reviewDone;save();renderReview();
  toast(state.reviewDone?'本周复盘已完成，辛苦了':'已重新开始复盘');
};

/* 新建任务 */
function openModal(){el('mask').classList.add('show');setTimeout(function(){el('mText').focus()},80)}
function closeModal(){el('mask').classList.remove('show')}
el('addBtn').onclick=openModal;
el('mCancel').onclick=closeModal;
el('mask').onclick=function(e){if(e.target===el('mask'))closeModal()};
el('mOk').onclick=function(){
  var txt=el('mText').value.trim();
  if(!txt){toast('先写个任务名称吧');return}
  state.tasks.push({id:state.nextId++,text:txt,tag:el('mTag').value,time:el('mTime').value||'17:00',done:false});
  save();renderTodo(el('search').value);renderStats();
  el('mText').value='';closeModal();toast('任务已添加');
};
el('mText').addEventListener('keydown',function(e){if(e.key==='Enter')el('mOk').click()});

/* 初次渲染 */
renderStats();renderTrend();renderDonut();renderTodo();renderSched();renderGoals();renderMemos();renderTools();renderReview();
</script>
</body>
</html>
